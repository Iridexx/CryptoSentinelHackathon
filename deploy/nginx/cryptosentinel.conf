# CryptoSentinel nginx site template.
# Replace `cryptosentinel.example.com` before enabling TLS.

server {
    listen 80;
    listen [::]:80;
    server_name cryptosentinel.example.com;

    root /opt/cryptosentinel/app/dist-dashboard;
    index index.html;

    client_max_body_size 2m;

    location /health/live {
        proxy_pass http://127.0.0.1:8000/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
