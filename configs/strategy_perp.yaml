# Versioned Perpetual strategy defaults.

perp:
  direction_mode: long_short
  value_area_pct: 68.0
  # SL/TP ancorati all'entry via ATR(14): R:R controllato a prescindere dalla leva.
  atr_stop_multiplier: 0.8   # SL = entry ∓ 0.8×ATR
  tp1_atr_multiplier: 2.5    # TP1 = entry ± 2.5×ATR (R:R ~1.67)
  tp2_atr_multiplier: 4.0    # TP2 = entry ± 4.0×ATR (R:R ~2.67)
  use_poc_for_tp2: true      # TP2 → POC se più ambizioso del target ATR
  # Protezione posizione: breakeven anticipato + trailing dinamico sulla leva.
  breakeven_trigger_atr: 1.0     # a +1×ATR lo SL sale a entry (+costi andata+ritorno)
  breakeven_offset_costs: true
  breakeven_buffer_pct: 0.1      # cuscinetto extra entry+0.1% (copre le fee; 0 = off)
  # Trailing: il moltiplicatore ATR scala con la leva del trade (base=leva min,
  # floor=leva max). Più alta la leva → trailing più stretto in prezzo.
  trailing_base_atr_largo: 4.0     # Largo: leva minima
  trailing_floor_atr_largo: 2.5    # Largo: leva massima
  trailing_base_atr_stretto: 2.5   # Stretto: leva minima
  trailing_floor_atr_stretto: 1.5  # Stretto: leva massima
  trailing_mode: largo             # default; override da setup mobile (largo|stretto)
  time_stop_hours: 8
  dynamic_leverage_enabled: true
  min_volume_profile_liquidity_usd: 50000.0
  default_leverage: 2
  # Range leva modulata sull'ATR in apertura (bassa vol → max, alta vol → min).
  min_leverage: 4
  max_leverage: 40
  leverage_atr_period: 72          # periodo ATR per la leva
  leverage_atr_baseline_hours: 120 # baseline storica per atr_min/atr_max (~5gg, cap 1500 candele)
  volume_profile_window_hours: 24
  volume_profile_candle_minutes: 5
