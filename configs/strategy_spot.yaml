# Versioned Spot strategy defaults.

spot:
  confidence_threshold: 0.55
  volatility_trigger_pct: 0.4
  relative_volume_threshold: 1.3
  atr_stop_multiplier: 2.2        # A (v3): stop = entry - ATR*2.2, nessun floor in %
  sl_mode: atr                    # "atr" | "lowest"; lowest usa minimo strutturale
  structural_stop_lookback_candles: 20
  structural_stop_buffer_pct: 1.10 # lowest: stop = minimo_20 * (1 - 1.10/100)
  tp1_atr_multiplier: 2.5         # B (v3): TP1 = entry + ATR*2.5
  tp2_atr_multiplier: 4.5         # B (v3): TP2 = entry + ATR*4.5 (target trailing finale)
  breakeven_enabled: true
  breakeven_trigger_atr: 1.2      # C (v3): a +1.2*ATR sposta lo stop a breakeven
  breakeven_offset_costs: true    # C (v3): breakeven = entry + costi andata+ritorno (fee/slippage)
  breakeven_buffer_pct: 0.1       # cuscinetto extra: stop a entry+0.1% quando il prezzo l'ha superato (copre le fee; 0 = off)
  trailing_atr_multiplier: 1.5    # C (v3): trailing = max_price - ATR*1.5
  trailing_active_from_start: true # C (v3): trailing attivo PRIMA di TP1
  tp1_close_fraction: 0.60        # D (v3): a TP1 chiude il 60%, lascia correre il 40% fino a TP2
  # E (v3): scaling-in a favore (mai al ribasso) — add solo su nuovo HH con stop a breakeven
  scale_in_enabled: true
  scale_in_size_fraction: 0.50    # add = 50% del notional corrente
  scale_in_require_new_hh: true   # solo su nuovo higher-high
  scale_in_require_be_stop: true  # solo se lo stop è già a breakeven
  scale_in_max_adds: 1            # massimo 1 aggiunta per posizione
  # G (v3): stop temporale ATR-aware — chiude solo i trade davvero fermi
  time_stop_enabled: false        # toggle UI/app-dashboard; default off
  time_stop_mode: atr             # "atr" | "hours"
  time_stop_lookback_candles: 8   # finestra di valutazione (candele 5m)
  time_stop_min_move_atr: 0.5     # se in N candele il movimento < 0.5*ATR -> chiudi
  time_stop_hours_fallback: 6     # usato solo se mode = hours
  # H (v3): filtro anti-spike sul trigger — non entrare (o entra ridotto) se la volatilità è anomala
  spike_filter_enabled: true
  spike_atr_ratio_max: 3.0        # se ATR_now > 3.0 * ATR_avg -> skip o size ridotta
  spike_atr_avg_period: 50        # media ATR di riferimento
  spike_action: skip              # "skip" | "reduce_size"
  spike_reduced_size_fraction: 0.5
  # Filtro regime mercato: niente nuovi buy spot quando BTC è in caduta forte.
  # Blocca se BTC (15m) è sotto EMA50 E fa un nuovo minimo (ultime 12 candele).
  # Sblocca SOLO quando BTC richiude sopra la EMA50 (macchina a stati, niente flip-flop).
  market_regime_filter_enabled: true
  market_regime_symbol: BTCUSDT
  market_regime_interval: 15m
  market_regime_ema_period: 50
  market_regime_low_lookback: 12
  # Filtro inversione mercato: se attivo, nuove entrate attendono conferma BTC
  # 15m con 2 candele verdi consecutive sopra EMA10; resta bullish finche'
  # BTC non fa 2 candele rosse consecutive sotto EMA10. Sul Perp e' simmetrico:
  # bullish blocca short, bearish blocca long. Non sblocca blocchi risk-off.
  market_reversal_filter_enabled: true
  market_reversal_symbol: BTCUSDT
  market_reversal_interval: 15m
  market_reversal_ema_period: 10
  market_reversal_confirmation_candles: 2
  trailing_distance_pct: 2.0      # LEGACY: non più usato (sostituito da trailing_atr_multiplier)
  partial_take_profit_pct: 3.0    # LEGACY: non più usato per i livelli TP (sostituito da tp*_atr_multiplier)
  time_stop_hours: 6              # LEGACY: sostituito da time_stop_mode/atr
  vwap_atr_extension_limit: 1.2
  rsi_weight_pct: 15.0
  trend_structure_weight_pct: 30.0
  relative_volume_weight_pct: 30.0
  btc_context_weight_pct: 15.0
  sentiment_weight_pct: 10.0
